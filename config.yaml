# =============================================================
# BME54701 project — shared configuration (Phase 1)
# Decided Oct 20, 2026. Change ONLY by team agreement, and log
# every change in PROGRESS.md (decision log).
# =============================================================

paths:
  data_root: "/Users/trananhchuong/OneDrive - VINACADEMY LLC/AI-based Neural Data Science/Dataset_ALL"      # each person sets their own local path
  results: "results"

random_seed: 42                           # k-means, permutations, bootstrap, CV

# -------------------------------------------------------------
# 1. Subject selection (fixed BEFORE looking at results)
# -------------------------------------------------------------
subjects:
  id_column: "subject_id"                 # never use orig_* columns
  max_interpolated_channels: 6            # drop recording if EEG.etc.iowa.nInterp > 6
  rest:
    require: "has_rest == 1"
    blink_sensitivity_flag: "nICremoved == 0"   # keep, but rerun Rest results without them
  simon:
    require: "has_simon == 1"
    allowed_trial_status: ["ok", "partial"]     # drop "exclude"
    min_trials_per_condition: 40                # after trial filtering; else drop from condition analyses
  rest_vs_simon: "subjects passing BOTH the rest and simon rules"
  clinical:
    missing_moca: "drop from MoCA analyses only"
    conflicting_sex_values: "treat as missing (e.g. 'F|M'); drop only from models with sex as covariate"
    updrs: "PD group only"

# -------------------------------------------------------------
# 2. Preprocessing for microstates
# -------------------------------------------------------------
preprocessing:
  bandpass_hz: [2.0, 20.0]                # MNE default zero-phase FIR; changed from 1-40 Hz on Oct 22 (muscle)
  resample_hz: 250
  reference: "average (already applied)"
  continuous_segment: "whole recording"

# -------------------------------------------------------------
# 3. Microstate clustering
# -------------------------------------------------------------
microstates:
  gfp_peak_outlier_sd: 3                  # drop GFP peaks > mean + 3 SD, per recording; mean and SD over the GFP values at the peaks
  min_peak_distance_samples: 1            # pycrostates default: every local GFP maximum is a peak
  peaks_per_subject_per_task: "min(n_rest, n_simon, 3000)"   # random sample, equal for both tasks
  two_level_clustering: true              # individual k-means -> cluster individual maps at group level
  algorithm: "modified k-means (polarity-invariant)"
  n_init: 100
  max_iter: 300
  draft_templates:
    n_subjects: 15                        # random sample stratified by group
    k: 4
  k_range: [4, 5, 6, 7]
  primary_k: 5                            # Oct 23 team decision (decision log): only K = 5 recovers canonical A-D (r >= 0.97 with draft) with E separate; GEV gains flatten after K = 5. The rule below gave K = 4 (kept as sensitivity)
  k_selection: >
    Best mean rank across silhouette and Calinski-Harabasz (higher is
    better); ties -> smaller K. Always report K = 4 and K = 5 as well.
    Davies-Bouldin and Dunn were in the original rule but are degenerate with
    pycrostates' distance (|1/r| - 1 explodes for near-orthogonal maps:
    Davies-Bouldin ~1e15, Dunn ~0 at every K), so they are excluded (Oct 23).
  k_selection_scores: ["silhouette", "calinski_harabasz"]
  state_labels: "match maps to canonical A-D (E...) by visual inspection; fixed once, used everywhere"
  labeling: "one-to-one (Hungarian) matching by polarity-invariant spatial correlation with the approved draft A-D; extra maps named E, F, G in order of explained variance; then visual confirmation"
  confirmed_labels:                       # Oct 23, visually confirmed
    5: ["A", "B", "C", "D", "E"]          # E = central maximum with opposite-sign temporal edges
    4: ["A", "B", "C", "Central"]         # sensitivity; C at K = 4 includes canonical D
  sensitivity_only_k: [6, 7]              # automatic labels, not confirmed
  recording_qc:                           # added Oct 22
    measure: "template GEV (recording's GFP peaks fitted to the group templates)"
    robust_z: "(x - median) / (1.4826 * MAD), per task across recordings"
    exclude_if_z_below: -3                # exclude that RECORDING from microstate analyses
    procedure: "fit on full cohort -> flag -> refit once without flagged recordings -> stop"
    log_excluded: ["subject_id", "group", "moca"]
    sensitivity: "repeat analyses with the excluded recordings included"
    per_k: true                           # QC applied separately for each K (template GEV depends on that K's templates)
    refit_excludes: "subject"             # a subject with any flagged recording is left out of the template refit; its unflagged recordings are still back-fitted
    gev_peaks: "all"                      # QC GEV uses all of a recording's GFP peaks (after the 3 SD cut), not the 3000-peak sample
  backfit:
    min_segment_length_samples: 5         # = 20 ms at 250 Hz
    reject_edges: true
    # Temporal smoothing (added Oct 22), values from the pycrostates 0.6.1
    # segmentation tutorial (tutorials/segmentation/00_segmentation.py, tag 0.6.1):
    # predict(raw, factor=10, half_window_size=10, min_segment_length=5, reject_edges=True).
    # (The group-level tutorial uses half_window_size=8; we follow the segmentation one.)
    smoothing_factor: 10                  # pycrostates `factor`; 0 = no smoothing (sensitivity analysis)
    smoothing_half_window_samples: 10     # pycrostates `half_window_size`; window = 21 samples = 84 ms at 250 Hz
  metrics: ["mean_duration", "occurrence", "coverage", "gev", "transition_matrix_no_self"]

# -------------------------------------------------------------
# 4. Simon condition-level analysis
# -------------------------------------------------------------
simon_conditions:
  epochs: "lock-cue (ready-made)"
  keep_trials: "beh_accuracy == 1 AND NOT badEpoch AND 150 <= beh_rt <= 1500 ms"
  filter: "2-20 Hz (preprocessing.bandpass_hz) on the full -1.0 to 2.5 s epoch, then crop; applies to any epochs back-fitted to the templates, incl. the recovery pilot"
  analysis_window_ms: [-200, 800]
  erp_plot_lowpass_hz: 30                 # for ERP figures only
  windows_ms:
    n2: [200, 350]
    theta: [400, 750]
  permutation_test:
    type: "paired cluster-based"
    n_permutations: 5000
    cluster_forming_p: 0.05

# -------------------------------------------------------------
# 5. Recovery pilot (exploratory)
# -------------------------------------------------------------
recovery:
  epochs: "lock-resp (ready-made)"
  filter: "same as simon_conditions.filter (2-20 Hz before back-fitting)"
  baseline: "subject's mean state probabilities, cue-locked -200 to 0 ms"
  reliability: "split-half (odd/even trials), Spearman-Brown corrected"
  keep_if_reliability_at_least: 0.5

# -------------------------------------------------------------
# 6. Statistics
# -------------------------------------------------------------
statistics:
  alpha: 0.05                             # two-sided
  fdr: "Benjamini-Hochberg, q = 0.05, within each family (RQ1, RQ2, RQ3)"
  primary_features:
    - "reorganization_index (Jensen-Shannon, rest vs simon transitions)"
    - "coverage_change per state (simon - rest)"
    - "mean_duration per state (rest and simon)"
    - "conflict_effect per window (n2, theta)"
  within_subject: "Wilcoxon signed-rank (primary); mixed model metric ~ task*group + age + sex + (1|subject) (secondary)"
  group_difference: "linear model feature ~ group + age + sex; Mann-Whitney as check"
  clinical_association: "Spearman partial correlation controlling age; whole sample and PD only"
  behavior_link: "Simon incongruent error rate"
  effect_sizes: "rank-biserial r / Cohen's d; rho with 95% bootstrap CI (2000 resamples)"
  report_n_at_every_step: true

# -------------------------------------------------------------
# 7. Outputs and naming
# -------------------------------------------------------------
outputs:
  feature_tables: "results/features/<analysis>.csv, one row per subject_id"
  column_names: "<task>_<metric>_<state>, e.g. rest_meandur_A, simon_cov_B"
  templates: "results/templates/templates_K<k>.fif"
  labels: "results/labels/<subject_id>_task-<Task>_labels.npy"
  figures: "results/figures/<owner>_<analysis>.png"
  environment: "pip freeze > requirements.txt on day 1; everyone installs from it"